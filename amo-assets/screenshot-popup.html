<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f0f0f0; display: flex; justify-content: center; padding: 40px; }
.browser { width: 1200px; background: white; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; }
.toolbar { background: #e8e8e8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.urlbar { flex: 1; background: white; border-radius: 20px; padding: 8px 16px; color: #666; }
.ext-icon { width: 32px; height: 32px; background: #1a73e8; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
.popup { width: 300px; background: white; border: 1px solid #ddd; border-radius: 8px; margin: 20px auto; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.popup h2 { font-size: 15px; margin: 0 0 12px; }
.status { font-size: 12px; padding: 6px 10px; border-radius: 6px; margin: 0 0 12px; background: #e6f4ea; color: #1a7f37; }
label { display: block; margin: 12px 0 4px; font-size: 13px; }
.hint { color: #666; font-size: 11px; margin: 2px 0 0; }
input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; border: 1px solid #d0d0d0; border-radius: 4px; }
.checkbox { display: flex; gap: 8px; align-items: flex-start; }
.page { padding: 40px; text-align: center; color: #999; }
</style></head>
<body>
<div class="browser">
  <div class="toolbar">
    <div class="ext-icon">⬇</div>
    <div class="urlbar">https://example.com/downloads</div>
  </div>
  <div class="page">
    <div class="popup">
      <h2>⬇ Grab</h2>
      <div class="status">Grab is running</div>
      <label class="checkbox"><input type="checkbox" checked> <span>Automatically send browser downloads to Grab</span></label>
      <p class="hint">Downloads are cancelled in the browser and opened in Grab instead.</p>
      <label>Only intercept downloads of at least</label>
      <div><input type="text" value="0" style="width:70px"> <span>MB</span></div>
      <p class="hint">Smaller downloads stay in the browser. 0 intercepts everything.</p>
      <label>Don't intercept these file types</label>
      <input type="text" placeholder="pdf, jpg, png">
      <p class="hint">Comma-separated extensions.</p>
    </div>
    <p>Click the Grab icon to see connection status and settings</p>
  </div>
</div>
</body>
</html>
