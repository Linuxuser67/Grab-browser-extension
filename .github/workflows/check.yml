name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: syntax check
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: firefox manifest in sync
        run: python3 build-aux/gen-firefox-manifest.py --check
      - name: Install shadow-root test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@30.1.3
      - name: tests
        # Explicit globs: `node --test test/` fails on Node 22.
        run: node --test test/*.test.js
