name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: syntax check
        run: node --check background.js && node --check content.js && node --check popup.js && node --check options.js
      - name: tests
        # Explicit globs: `node --test test/` fails on Node 22.
        run: node --test test/*.test.js
