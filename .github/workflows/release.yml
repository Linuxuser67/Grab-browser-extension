name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the extension zip to"
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: package the extension
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          zip -qr "grab-extension-${TAG}.zip" . \
            -x ".git/*" ".github/*" "test/*"
      - name: attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "grab-extension-${TAG}.zip" --clobber
