name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the extension zip to"
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: verify tag matches manifest version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          # Tags are like v1.3.12; the manifest holds 1.3.12.
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match manifest version $VERSION"
            exit 1
          fi
      - name: regenerate the Firefox manifest from manifest.json
        run: python3 build-aux/gen-firefox-manifest.py
      - name: package the extension
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          root="$PWD"
          zip -qr "grab-extension-${TAG}.zip" . \
            -x ".git/*" ".github/*" "build-aux/*" "test/*" "amo-assets/*" "assets/*" "README.md" "manifest.firefox.json" "grab-extension-*.zip"
          zip -qr "grab-extension-firefox-${TAG}.zip" . \
            -x ".git/*" ".github/*" "build-aux/*" "test/*" "amo-assets/*" "assets/*" "README.md" "manifest.json" "manifest.firefox.json" "grab-extension-*.zip"
          tmpdir="$(mktemp -d)"
          cp manifest.firefox.json "$tmpdir/manifest.json"
          (cd "$tmpdir" && zip -q "$root/grab-extension-firefox-${TAG}.zip" manifest.json)
          rm -rf "$tmpdir"
      - name: attach the zips to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" "grab-extension-${TAG}.zip" "grab-extension-firefox-${TAG}.zip" --clobber
