name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the extension zip to"
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: package the extension
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          root="$PWD"
          zip -qr "grab-extension-${TAG}.zip" . \
            -x ".git/*" ".github/*" "test/*" "manifest.firefox.json" "grab-extension-*.zip"
          zip -qr "grab-extension-firefox-${TAG}.zip" . \
            -x ".git/*" ".github/*" "test/*" "manifest.json" "manifest.firefox.json" "grab-extension-*.zip"
          tmpdir="$(mktemp -d)"
          cp manifest.firefox.json "$tmpdir/manifest.json"
          (cd "$tmpdir" && zip -q "$root/grab-extension-firefox-${TAG}.zip" manifest.json)
          rm -rf "$tmpdir"
      - name: attach the zips to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "grab-extension-${TAG}.zip" "grab-extension-firefox-${TAG}.zip" --clobber
