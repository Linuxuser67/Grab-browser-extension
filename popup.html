<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1e1e1e;
        --border: #d0d0d0;
        --input-bg: #ffffff;
        --saved: #1a7f37;
        --accent: #1a73e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #e8e8e8;
          --border: #404040;
          --input-bg: #2d2d2d;
          --saved: #4caf50;
          --accent: #8ab4f8;
        }
      }
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        width: 300px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 15px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2 img {
        width: 20px;
        height: 20px;
      }
      .options-button {
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .options-button:hover {
        background: rgba(127, 127, 127, 0.12);
      }
      .options-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .options-button svg {
        width: 18px;
        height: 18px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
      }
      label.checkbox {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        cursor: pointer;
      }
      label.checkbox input {
        margin-top: 2px;
        accent-color: var(--accent);
      }
      input[type="text"],
      input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-top: 4px;
        background: var(--input-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 13px;
      }
      input[type="text"]:focus,
      input[type="number"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: var(--accent);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .row input[type="number"] {
        width: 70px;
        margin-top: 0;
      }
      #saved {
        color: var(--saved);
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        margin: 0;
        font-size: 12px;
        transition: opacity 0.3s, max-height 0.3s, margin 0.3s;
      }
      #saved.show {
        opacity: 1;
        max-height: 20px;
        margin: 12px 0 0;
      }
      .status {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        margin: 0 0 12px;
      }
      .status.ok {
        background: #e6f4ea;
        color: #1a7f37;
      }
      .status.down {
        background: #fce8e6;
        color: #c5221f;
      }
      @media (prefers-color-scheme: dark) {
        .status.ok {
          background: #1a3a24;
          color: #4caf50;
        }
        .status.down {
          background: #3a1a1a;
          color: #f28b82;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #saved {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <h2><img src="icons/icon32.png" alt="" />Grab</h2>
      <button
        type="button"
        id="openOptions"
        class="options-button"
        aria-label="Open full options"
        title="Options"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3" />
          <path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z" />
        </svg>
      </button>
    </header>
    <div id="grabStatus" class="status" role="status" aria-live="polite" aria-atomic="true">Checking Grab…</div>

    <label class="checkbox">
      <input type="checkbox" id="interceptDownloads" />
      <span>Automatically send browser downloads to Grab</span>
    </label>

    <label for="minSizeMB">Only intercept downloads of at least</label>
    <div class="row">
      <input type="number" id="minSizeMB" min="0" step="1" />
      <span>MB</span>
    </div>

    <label for="skipTypes">Don't intercept these file types</label>
    <input type="text" id="skipTypes" placeholder="pdf, jpg, png" />

    <label class="checkbox">
      <input type="checkbox" id="showContextMenu" />
      <span>Show “Download with Grab” in the right-click menu</span>
    </label>

    <label class="checkbox">
      <input type="checkbox" id="detectVideos" />
      <span>Detect videos playing in tabs</span>
    </label>

    <p id="saved" role="status" aria-live="polite"></p>

    <script src="shared.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
